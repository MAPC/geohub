<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAPC GeoHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Tokens mirror choropleth-map-creative-economy/scripts/styles.css so the
       hub and the tools it links to read as one product. */
    :root {
      --mapc-navy: #1F4E79;
      --mapc-navy-dark: #163A5C;
      --text-primary: #333333;
      --text-secondary: #666666;
      --page-bg: #FBFBFD;
      --card-bg: #FFFFFF;
      --card-border: #E4E7EC;
      --radius-sm: 6px;
      --radius-md: 10px;
      --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-sm: 0 2px 6px rgba(16, 24, 40, 0.06);

      --text-2xs: 10px;
      --text-xs: 11px;
      --text-sm: 12px;
      --text-base: 13px;
      --text-md: 14px;
      --text-lg: 16px;
      /* A page needs two steps above what the app's sidebar uses */
      --text-xl: 20px;
      --text-2xl: 28px;

      --tint-hover: #F5F9FD;
      --focus-ring: 0 0 0 3px rgba(31, 78, 121, 0.25);
      --dur-fast: 120ms;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 40px 64px;
      background: var(--page-bg);
      color: var(--text-primary);
      font-family: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .wrap { max-width: 800px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    #brand-mark { display: block; height: 36px; width: auto; border-radius: 4px; flex-shrink: 0; }
    h1 {
      font-size: var(--text-2xl); font-weight: 700; color: var(--mapc-navy);
      margin: 0; letter-spacing: -0.02em; line-height: 1.15;
    }
    .tagline {
      color: var(--text-secondary); font-size: var(--text-lg);
      margin: 0 0 36px; max-width: 60ch; line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
      gap: 16px;
    }
    .tool { display: flex; flex-direction: column; gap: 6px; }

    .card {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-xs);
      text-decoration: none; color: inherit; display: block;
      transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
    }
    .card:hover { border-color: var(--mapc-navy); box-shadow: var(--shadow-sm); }
    .card:focus-visible { outline: none; border-color: var(--mapc-navy); box-shadow: var(--focus-ring); }
    .card h2 {
      font-size: var(--text-lg); font-weight: 700; color: var(--mapc-navy);
      margin: 0 0 6px; letter-spacing: -0.01em;
    }
    .card p { font-size: var(--text-md); color: var(--text-secondary); margin: 0; line-height: 1.45; }

    .tool-source { font-size: var(--text-sm); color: var(--text-secondary); margin: 0; padding-left: 2px; }
    .tool-source a { color: var(--mapc-navy); text-underline-offset: 2px; }
    .tool-source a:hover { color: var(--mapc-navy-dark); }
    .tool-source a:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 2px; }

    ::selection { background: rgba(31, 78, 121, 0.18); }

    @media (max-width: 640px) {
      body { padding: 32px 20px 48px; }
      h1 { font-size: var(--text-xl); }
      .tagline { font-size: var(--text-md); margin-bottom: 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      /* Hover feedback stays; there is no travel here to remove */
      * { transition-duration: var(--dur-fast); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img id="brand-mark" src="./choropleth-map-creative-economy/assets/logo.png"
           alt="Metropolitan Area Planning Council">
      <h1>MAPC GeoHub</h1>
    </header>
    <p class="tagline">Interactive spatial tools, maps, and web applications.</p>

    <main class="grid">
      <div class="tool">
        <a href="./choropleth-map-creative-economy/" class="card">
          <h2>Creative Enterprises Map</h2>
          <p>Interactive choropleth visualization of creative economy metrics across the region.</p>
        </a>
        <p class="tool-source">Industries included: <a href="https://github.com/MAPC/postgres_data_updates/blob/main/creative_economy/nefa_code_list/naics_2022_nefa.csv" target="_blank" rel="noopener noreferrer">NEFA code list (NAICS 2022)</a></p>
      </div>
    </main>
  </div>
</body>
</html>
